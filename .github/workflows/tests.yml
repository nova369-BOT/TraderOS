# The safety net: every change is checked automatically.
#
# Runs the full backend test suite on every push to main and on every pull
# request, so a change that breaks something is caught the moment it is
# pushed, not when a user finds it. The official baseline measured on
# Python 3.11 (with the JS toolchain present, as here) is
# 219 passed / 1 skipped — the skip is the indicator-parity truth gate,
# which needs tests/gen_ts_truth.mjs run first by design.
#
# Python 3.11 is the version the baseline was measured on. When 3.10/3.12
# are actually supported, they belong here as a matrix - not before, so a
# green badge never means "checked on a version nobody ships".
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: test
        run: pytest tests/ -q
  frontend:
    # The chart pane ships as a committed bundle; a type error today becomes
    # a silent runtime bug tomorrow. Typecheck + production build gate every
    # frontend change. Baseline measured 2026-09-19: tsc 0 errors, vite build
    # green (deterministic: a clean rebuild reproduces the committed bundle
    # byte-for-byte).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: install
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
