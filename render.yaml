# Render blueprint: one-click deploy → https://render.com/deploy
#   ?repo=https://github.com/nova369-BOT/TraderOS
#   &branch=arena/01a0b513-traderos
# Creates a NEW web service (traderos-w) alongside anything you already run.
# The image is pure Python: market data is native direct (Binance/Coinbase),
# one hop, no child process, no Go toolchain anywhere (D12/D13).
services:
  - type: web
    name: traderos-w
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # keep re-deploying automatically when this branch is pushed
    autoDeploy: true
    envVars:
      # The engine's host guard trusts loopback only by default; public
      # hosting must whitelist its own host suffix or browsers are rejected.
      - key: LSE_TRUSTED_HOST_SUFFIXES
        value: onrender.com
      # Built-in keyless sources listed even when the fleet directory does
      # not mention them (the /api/providers gate is fleet-driven). ONE
      # Binance surface exists (D12, owner-locked): binance — direct
      # native, one hop, no child process; coinbase is the second
      # independent pipeline (USD spot direct).
      - key: LSE_EXTRA_PROVIDERS
        value: binance,coinbase
