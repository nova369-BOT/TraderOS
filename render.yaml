# Render blueprint: one-click deploy → https://render.com/deploy
#   ?repo=https://github.com/nova369-BOT/TraderOS
#   &branch=arena/01a0b513-traderos
# Creates a NEW web service (traderos-w) alongside anything you already run.
# The image builds the REAL edgedepth-gateway from the vendored pin and the
# engine runs it as a managed child process — one service, no wiring.
services:
  - type: web
    name: traderos-w
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # keep re-deploying automatically when this branch is pushed
    autoDeploy: true
    envVars:
      # The engine's host guard trusts loopback only by default; public
      # hosting must whitelist its own host suffix or browsers are rejected.
      - key: LSE_TRUSTED_HOST_SUFFIXES
        value: onrender.com
      # Built-in keyless sources listed even when the fleet directory does
      # not mention them (the /api/providers gate is fleet-driven). binance
      # is the terminal's crypto book; edgedepth is the same Binance USD-M
      # feed served through the managed gateway (charts, live ticks, book).
      - key: LSE_EXTRA_PROVIDERS
        value: binance,edgedepth
      # Optional: point the engine at YOUR gateway instead of the managed
      # child in the image (external mode — Start/Stop become read-only):
      # - key: EDGEDEPTH_GATEWAY_URL
      #   value: wss://<your-gateway>.onrender.com/ws
