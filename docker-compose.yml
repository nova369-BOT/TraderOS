services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradeos:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TRADEOS_ENV: "${TRADEOS_ENV:-development}"
      FMP_API_KEY: "${FMP_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      CACHE_SIGNING_KEY: "${CACHE_SIGNING_KEY:-}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      DATABASE_URL: "${DATABASE_URL:-sqlite+aiosqlite:////data/tradeos.db}"
      KITE_API_KEY: "${KITE_API_KEY:-}"
      KITE_API_SECRET: "${KITE_API_SECRET:-}"
      KITE_ACCESS_TOKEN: "${KITE_ACCESS_TOKEN:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      TRADEOS_PREFETCH_ENABLED: "${TRADEOS_PREFETCH_ENABLED:-${OPENSCREENS_PREFETCH_ENABLED:-0}}"
      TRADEOS_SQLITE_URL: "${TRADEOS_SQLITE_URL:-${OPENSCREENS_SQLITE_URL:-sqlite:////data/tradeos.db}}"
      TRADEOS_CORS_ORIGINS: "${TRADEOS_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LM_STUDIO_MODEL: "${LM_STUDIO_MODEL:-google/gemma-4-26b-a4b}"
      LM_STUDIO_ENABLED: "${LM_STUDIO_ENABLED:-true}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-openrouter}"
      AGENT_MODEL: "${AGENT_MODEL:-openai/gpt-oss-20b:free}"
      AGENT_DISABLE_MODEL_FALLBACKS: "${AGENT_DISABLE_MODEL_FALLBACKS:-false}"
      AGENT_MODELS_TOOL_USE: "${AGENT_MODELS_TOOL_USE:-meta-llama/llama-3.3-70b-instruct:free,qwen/qwen3-coder:free,openai/gpt-oss-20b:free}"
      AGENT_MODELS_REASONING: "${AGENT_MODELS_REASONING:-deepseek/deepseek-r1:free,qwen/qwq-32b:free,openai/gpt-oss-120b:free,openai/gpt-oss-20b:free}"
      AGENT_MODELS_GENERAL: "${AGENT_MODELS_GENERAL:-openai/gpt-oss-20b:free,google/gemini-2.0-flash-exp:free}"
      AGENT_FALLBACK_MODELS: "${AGENT_FALLBACK_MODELS:-openai/gpt-oss-20b:free,qwen/qwen3-coder:free,meta-llama/llama-3.3-70b-instruct:free}"
      AGENT_DEBATE_ENABLED: "${AGENT_DEBATE_ENABLED:-true}"
      AGENT_STRATEGY_LOOP_ENABLED: "${AGENT_STRATEGY_LOOP_ENABLED:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tradeos_data:/data
    develop:
      watch:
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./config
        - action: rebuild
          path: ./data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tradeos}"
      POSTGRES_USER: "${POSTGRES_USER:-tradeos}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tradeos}"
    ports:
      - "5432:5432"
    volumes:
      - tradeos_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tradeos_data:
  tradeos_postgres_data:
