<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-label="TradeOS">
  <!-- TradeOS primary lockup: emblem + wordmark.
       "Trade" in charcoal #14181D, "OS" in gold #C9A227,
       geometric grotesque sans-serif. -->
  <g fill="none">
    <path d="M 266.2 109 A 125 125 0 1 1 133.8 109"
          stroke="#14181D" stroke-width="34" stroke-linecap="butt"/>
    <rect x="104" y="212" width="68" height="16" rx="8" fill="#14181D"/>
    <rect x="228" y="212" width="68" height="16" rx="8" fill="#14181D"/>
    <rect x="195" y="52" width="10" height="268" rx="5" fill="#C9A227"/>
    <rect x="169" y="160" width="62" height="130" rx="10" fill="#C9A227"/>
  </g>
  <text x="470" y="292" font-family="Montserrat, Futura, 'Century Gothic', 'Avenir Next', 'DejaVu Sans', sans-serif"
        font-size="190" font-weight="700" letter-spacing="-3" fill="#14181D">Trade</text>
  <text x="1060" y="292" font-family="Montserrat, Futura, 'Century Gothic', 'Avenir Next', 'DejaVu Sans', sans-serif"
        font-size="190" font-weight="700" letter-spacing="-3" fill="#C9A227">OS</text>
</svg>
