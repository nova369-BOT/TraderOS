    <path d="M 266.2 109 A 125 125 0 1 1 133.8 109"
          stroke="#16181E" stroke-width="34" stroke-linecap="butt"/>
    <rect x="104" y="212" width="68" height="16" rx="8" fill="#16181E"/>
    <rect x="228" y="212" width="68" height="16" rx="8" fill="#16181E"/>
    <rect x="195" y="52" width="10" height="268" rx="5" fill="#8B7FD4"/>
    <rect x="169" y="160" width="62" height="130" rx="10" fill="#8B7FD4"/>
  </g>
  <text x="470" y="292" font-family="Montserrat, Futura, 'Century Gothic', 'Avenir Next', 'DejaVu Sans', sans-serif"
        font-size="190" font-weight="700" letter-spacing="-3" fill="#16181E">ARQ</text>
  <text x="935" y="292" font-family="Montserrat, Futura, 'Century Gothic', 'Avenir Next', 'DejaVu Sans', sans-serif"
        font-size="190" font-weight="700" letter-spacing="-3" fill="#8B7FD4">OS</text>
</svg>
