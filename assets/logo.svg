<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-label="ARQOS">
  <!-- ARQOS primary lockup: emblem + wordmark.
       "ARQ" in charcoal #16181E, "OS" in restrained purple #8B7FD4,
       geometric grotesque sans-serif. Quantum Core palette. -->
